[package]
name = "e2-backend-agreement"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not part of the geodatafusion workspace.
[workspace]

[dependencies]
geo = "=0.31.0"
geo-types = "0.7.19"
geo-traits = "=0.3.0"
wkb = "=0.9.1"
# Bundled GEOS 3.14.1 (geos-src 0.2.4), the same GEOS version as the PostGIS oracle.
geos = { version = "=11.1.1", features = ["static", "v3_11_0"] }
geos-sys = "=2.0.9"
geos-src = "=0.2.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Release, as geodatafusion ships: geo's debug_asserts are off.
debug = false
