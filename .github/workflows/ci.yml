name: Rust

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-all-features:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features builds PROJ from source (proj-bundled), which needs SQLite.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev
      # --all-features builds the pinned GEOS from source (geos-static), so the parity tests
      # run against the GEOS they were recorded with.
      - name: Clippy
        run: cargo clippy --all-features --tests -- -D warnings
      - name: Check
        run: cargo check --all-features
      - name: Test
        run: cargo test --all-features

  check-features:
    name: Check feature gating
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev
      # Without GEOS, and against the system GEOS at the lowest supported feature, so a UDF
      # behind the wrong feature fails here rather than for a user.
      - name: Check without features
        run: cargo check -p geodatafusion
      - name: Check with the system GEOS
        run: cargo check -p geodatafusion --features geos-3_11

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-14
          components: rustfmt
      - name: Fmt
        run: cargo +nightly-2025-05-14 fmt -- --check --unstable-features --config imports_granularity=Module,group_imports=StdExternalCrate

  docs-no-warnings:
    name: Test docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # --all-features builds PROJ from source (proj-bundled), which needs SQLite.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev
      # Note: in the future expand to all crates in the workspace
      - name: Test that docs build without warnings
        run: cargo doc --all-features --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
