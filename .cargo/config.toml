[alias]
# Run the PostGIS parity sqllogictests, e.g. `cargo slt st_area` or `cargo slt -- --complete st_area`.
# Always with --all-features, which is what parity.txt and CI use.
slt = "test -p geodatafusion --all-features --test sqllogictests --"

# The `atlas` package registry this branch's manifests name. Publishing sets
# CARGO_REGISTRIES_ATLAS_INDEX; nothing else contacts this address.
[registries.atlas]
index = "sparse+http://127.0.0.1:18000/api/v1/crates/"
credential-provider = "cargo:token"
