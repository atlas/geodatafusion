[package]
name = "geodatafusion"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Spatial extensions for Apache DataFusion"
categories = { workspace = true }
rust-version = { workspace = true }


[features]
default = ["sql"]
# Enables the geometry, box2d and box3d SQL types and their casts.
sql = ["datafusion/sql"]
# Enables GEOS-backed UDFs.
# We only use explicitly versioned flags,
# and the structure should be recursive
# (with higher version targets implying lower version ones
# in a chain.)
geos-3_11 = ["dep:geos", "geos/v3_11_0"]
# Builds GEOS from source and links it statically, instead of linking the system library.
# The bundled version (geos-src 0.2.4, GEOS 3.14.1) is pinned to the PostGIS image the parity
# tests are recorded with; see tests/sqllogictests/README.md.
geos-static = ["geos-3_11", "geos/static"]
# Enables PROJ-backed UDFs (ST_Transform and the pipeline functions). Links the system PROJ if
# pkg-config finds PROJ >= 9.6.2; otherwise proj-sys builds its bundled PROJ 9.6.2 from source,
# which needs cmake and sqlite3. PROJ reads proj.db at runtime (PROJ_DATA to point it elsewhere).
proj = ["dep:proj-sys"]
# Always builds the bundled PROJ 9.6.2 from source, ignoring the system library.
proj-bundled = ["proj", "proj-sys/bundled_proj"]

[dependencies]
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
datafusion = { workspace = true }
datafusion-doc = { workspace = true }
datafusion-macros = { workspace = true }
geo = { workspace = true }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true }
geoarrow-schema = { workspace = true }
geos = { workspace = true, optional = true }
proj-sys = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wkb = { workspace = true }
wkt = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
async-trait = { workspace = true }
# The sqllogictests run arbitrary PostGIS-flavoured SQL, so enable the full built-in function set.
datafusion = { workspace = true, features = [
    "sql",
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "math_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
futures = { workspace = true }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true, features = ["test-data"] }
geoarrow-schema = { workspace = true }
object_store = { workspace = true, features = ["http"] }
sqllogictest = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }
tokio-postgres = { workspace = true }

[[test]]
name = "sqllogictests"
path = "tests/sqllogictests/main.rs"
harness = false
# The harness plans the geometry type.
required-features = ["sql"]

[package.metadata.docs.rs]
# Not geos-static or proj-bundled, which would build GEOS and PROJ from source; geos/dox and
# proj-sys/nobuild skip linking them.
features = ["geos-3_11", "geos/dox", "proj", "proj-sys/nobuild"]
